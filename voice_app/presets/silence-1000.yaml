# Preset: silence-1000
# Endpoint = 1000 ms of silence after speech. Experiment 1 (endpointing).
# Don't edit once results have been reported from it: make a new preset.

# Voice Control Prototype: current settings.
# The web page edits this file. Each stage has `use:` (the option in force)
# and a block of knobs per option, so switching back keeps your last values.
# See docs/02-options.md for what each option and knob does.

device: auto            # auto | cuda | metal | cpu   (docs/03-portability.md)

audio:
  input_device: null    # null = system default; otherwise part of the device NAME, not an index
  sample_rate: 16000    # what every stage sees (capture at the device rate, resample once)
  frame_samples: 512    # 32 ms at 16 kHz (Silero VAD's frame size)
  preroll_ms: 500

pipeline:
  armed_timeout_s: 4.0  # after the wake word, give up if no speech starts within this
  max_utterance_s: 15.0 # hard cap on one command

trigger:
  use: push_to_talk     # openwakeword | push_to_talk | both
  openwakeword:
    model: hey_jarvis   # pre-trained for now; later models/hey_rosa.onnx
    threshold: 0.5
    patience: 1
    cooldown_s: 1.5
  push_to_talk: {}

vad:
  use: silero           # silero | webrtc
  silero:
    threshold: 0.5
    min_speech_ms: 100
  webrtc:
    aggressiveness: 2

endpoint:
  use: silence      # silence | adaptive | smart_turn | ptt_release
  silence:
    silence_ms: 1000
  adaptive:
    short_silence_ms: 400
    long_silence_ms: 1500
    continue_words: [by, to, and, then, point, about, at, of, the, a]
  smart_turn:
    pause_ms: 200
    threshold: 0.5
    max_wait_ms: 3000
  ptt_release: {}

stt:
  use: parakeet         # parakeet | whisper_cpp | faster_whisper | moonshine
  mode: batch           # batch | streaming
  partial_every_ms: 500 # for pseudo-streaming engines
  language: en
  prompt: "Rosa, tool, home, joint, gripper, x, y, z, centimetres, millimetres, degrees, up, down, left, right, forward, back, stop."
  parakeet:
    model: mlx-community/parakeet-tdt-0.6b-v3
    backend: auto       # auto | mlx | sherpa_onnx | nemo
  whisper_cpp:
    model: base.en
    driver: bindings    # bindings | server
    server_url: http://127.0.0.1:8178
  faster_whisper:
    model: small.en
    compute_type: auto  # auto -> int8 on cpu, float16 on cuda
  moonshine:
    model: moonshine-streaming-small

output:
  screen: true
  log: true             # runs/<date>-live.jsonl
  console:              # later, see docs/06-integration-later.md. Leave disabled.
    enabled: false
    url: http://192.168.1.145:8000
