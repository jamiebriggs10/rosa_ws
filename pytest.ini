[pytest]
# ROS registers pytest plugins (launch_testing, launch_ros) that break current pytest; we do not use them.
# The voice tests that load a speech model are marked "model" and skipped unless asked for: -m model
addopts = -p no:launch_testing -p no:launch_ros -m "not model"
testpaths = tests
markers =
    model: loads a speech model (downloads it on first run)
